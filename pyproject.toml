[project]
name = "llm-adapter"
version = "2.1.0"
description = "High-Performance Multi-Model LLM Inference Orchestrator with Extended Context Support (640K tokens)"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Anil Srirangapatna Nagesh", email = "anil@example.com"}
]
keywords = [
    "llm",
    "inference",
    "nemotron",
    "anthropic",
    "claude",
    "orchestration",
    "vllm",
    "ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.135.3",
    "hf-transfer>=0.1.9",
    "httpx>=0.28.1",
    "huggingface-hub>=0.36.2",
    "pyyaml>=6.0.3",
    "transformers>=4.56.0,<5.0.0",  # vLLM 0.19 requires transformers <5.0
    "uvicorn>=0.44.0",
    "vllm==0.19.0",                 # Pin to 0.19.0 for CUDA 12.x compatibility
    # NOTE: PyTorch 2.10.0+cu129 installed via setup script (see scripts/setup_venv.sh)
    # vLLM 0.19.0 chosen for CUDA 12.x pre-built wheel availability
    # Driver: 575.64.03 (CUDA 12.9)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.0",
    "mypy>=1.15.0",
]

[project.urls]
Homepage = "https://github.com/your-username/nemo_orchestrator"
Documentation = "https://github.com/your-username/nemo_orchestrator#readme"
Repository = "https://github.com/your-username/nemo_orchestrator"
Issues = "https://github.com/your-username/nemo_orchestrator/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_orchestrator"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[tool.uv]
# PyTorch 2.10.0+cu129 installed via setup script (scripts/setup_venv.sh)
# vLLM 0.19.0 chosen for CUDA 12.x pre-built wheel compatibility
# CUDA Toolkit 12.4 required for FlashAttention JIT compilation (nvcc)
# Compatible with NVIDIA Driver 575.64.03 (CUDA 12.9 support)
