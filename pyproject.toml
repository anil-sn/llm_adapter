[project]
name = "llm-adapter"
version = "2.1.0"
description = "High-Performance Multi-Model LLM Inference Orchestrator with Extended Context Support (640K tokens)"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Anil Srirangapatna Nagesh", email = "anil@example.com"}
]
keywords = [
    "llm",
    "inference",
    "nemotron",
    "anthropic",
    "claude",
    "orchestration",
    "vllm",
    "ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "cmake>=4.3.2",
    "fastapi>=0.135.3",
    "hf-transfer>=0.1.9",
    "httpx>=0.28.1",
    "huggingface-hub>=0.36.2",
    "ninja>=1.11.1",
    "nvidia-nccl-cu12>=2.30.7",
    "packaging>=24.0",
    "pyyaml>=6.0.3",
    "setuptools-rust>=1.12.1",
    "setuptools-scm>=10.0.5",
    "torch==2.11.0",
    "transformers>=4.56.0",
    "uvicorn>=0.44.0",
    "vllm>=0.26.0",
    "wheel>=0.47.0",
    "whichllm",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.0",
    "mypy>=1.15.0",
]
tools = [
    "ddgs>=1.0.0",  # Web search tool (renamed from duckduckgo-search)
]

[project.urls]
Homepage = "https://github.com/your-username/llm_adapter"
Documentation = "https://github.com/your-username/llm_adapter#readme"
Repository = "https://github.com/your-username/llm_adapter"
Issues = "https://github.com/your-username/llm_adapter/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_adapter"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[tool.uv]
# vLLM v0.24.0 compiled from source (v0.24.0+cu132 indicates local build)
# Build command for ultra-fast clean reinstall (using 96 parallel jobs):
#   uv pip uninstall vllm
#   rm -rf /tmp/vllm-build-fast && mkdir -p /tmp/vllm-build-fast && cd /tmp/vllm-build-fast
#   git clone --depth 1 --branch v0.24.0 https://github.com/vllm-project/vllm.git /tmp/vllm-build-fast/vllm
#   uv pip install setuptools-scm
#   VLLM_TARGET_DEVICE=cuda TORCH_CUDA_ARCH_LIST="8.0 8.6 8.9 9.0" MAX_JOBS=96 uv pip install --no-build-isolation /tmp/vllm-build-fast/vllm
#
# System requirements:
#   - CUDA Toolkit 13.2 at /usr/local/cuda
#   - cuDNN 9: sudo apt install libcudnn9-cuda-13 libcudnn9-dev-cuda-13
#   - NVIDIA Driver 595.71.05+ (supports CUDA 13.2)
