# LLM Orchestrator - QwQ-32B AWQ 2-GPU Configuration (Snappy 128K Context)
# Model: Qwen/QwQ-32B-AWQ (32B Dense Reasoning Model with native Chain-of-Thought)
# Quantization: AWQ 4-bit (Native GPU hardware decompression)
# Hardware: 2× RTX 6000 Ada (GPUs 2,3 strictly isolated, GPUs 0,1 left for Coder)
# Topology: PCIe topology, no NVLink
# Inherits from: config.yaml, config-adapter.yaml

# ============================================================================
# MODEL IDENTITY
# ============================================================================
model:
  chat_template: "config/qwen_fixed.jinja"
  id: "Qwen/QwQ-32B-AWQ"
  served_model_name: "reasoner"
  tokenizer_mode: "auto"
  # chat_template: auto (uses model's built-in template from tokenizer_config.json)

# ============================================================================
# CLUSTER & REPLICA RUNNER ISOLATION (Strictly uses GPU 2,3 only)
# ============================================================================
replicas:
  count: 1
  gpu_groups: ["2,3"]                   # Only visible to GPU 2 and GPU 3
  core_ranges: ["56-111"]               # Restrict to second 56 CPU threads
  base_port: 8001                       # Bind strictly to port 8001 to prevent conflict with Coder on 8000

# ============================================================================
# HARDWARE OVERRIDES
# ============================================================================
hardware:
  gpu_memory_utilization: 0.94          # High utilization to maximize KV cache headroom on 2 GPUs
  tensor_parallel_size: 2               # TP=2 (split across 2 GPUs)

# ============================================================================
# INFERENCE OVERRIDES
# ============================================================================
inference:
  # Context settings (optimized for speed)
  max_model_len: 262144                 # 256K context (2x native, balanced speed vs capacity)

  # KV cache optimization
  kv_cache_dtype: "fp8"                 # Native FP8 KV Cache (critical for memory safety)

  # Prefill optimization (faster for typical reasoning prompts)
  enable_chunked_prefill: false         # Disabled for faster prefill on normal prompts
  max_num_batched_tokens: 16384         # Larger chunks for faster prefill
  max_num_seqs: 1                       # Lock concurrency to 1 to guarantee absolute speed and stability

  # YaRN RoPE Scaling (extends native 128K context to 256K)
  hf_overrides:
    rope_parameters:
      rope_type: "yarn"
      factor: 2.0                       # 2x scaling (128K native -> 256K context)
      original_max_position_embeddings: 131072
      rope_theta: 1000000.0             # Prevent positional embedding frequency decay

  # Speculative decoding (2-3x faster generation via n-gram prediction)
  speculative_decoding:
    method: "ngram"
    num_speculative_tokens: 5
    ngram_prompt_lookup_max: 4
    ngram_prompt_lookup_min: 1

  # Reasoning (QwQ-32B is a native reasoning model, we enable thinking tags extraction)
  enable_thinking: true
  reasoning_parser: "qwen3"             # Natively extract <thought> tags
  enable_auto_tool_choice: true         # Enable tool calling
  tool_call_parser: "qwen3_xml"         # Use XML parser (native format Qwen3 was trained on)

# ============================================================================
# VLLM ENVIRONMENT
# ============================================================================
vllm:
  env:
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True" # Aggressively combat PyTorch memory fragmentation
    NCCL_P2P_DISABLE: "1"                             # CRITICAL: Disable NCCL P2P to prevent deadlocks on PCIe-only systems
    VLLM_FP8_ACTIVATION: "1"                          # Force native FP8 execution for maximum throughput
