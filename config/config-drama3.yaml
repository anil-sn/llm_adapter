# Fish Audio Drama 3 served by SGLang-Omni and routed through llm_adapter.
inference_backend: "sglang_omni"

model:
  id: "fishaudio/drama-3"
  served_model_name: "drama-3"

replicas:
  count: 1
  base_port: 8000
  # Keep all GPUs visible for future extensions. Drama 3's current SGLang-Omni
  # engine is single-GPU; its supporting stages are placed on GPUs 2 and 3.
  gpu_groups: ["0,1,2,3"]
  core_ranges: ["0-55"]

hardware:
  tensor_parallel_size: 1

inference:
  max_model_len: 8192

sglang_omni:
  # Installed by `uv sync --project runtimes/sglang_omni`.
  executable: "runtimes/sglang_omni/.venv/bin/sgl-omni"
  host: "127.0.0.1"
  args:
    # Keep the 6 GiB reference-audio codec separate from the TTS engine.
    - "--preprocessing.gpu"
    - "3"
    # Drama 3's current SGLang-Omni engine does not support tensor parallelism.
    # It has GPU 0 to itself, leaving ample KV-cache headroom.
    - "--tts_engine.gpu"
    - "0"
    - "--tts_engine.gpu_memory_fraction"
    - "0.90"
    # The codec vocoder has an independent GPU and only needs a small share.
    - "--vocoder.gpu"
    - "2"
    - "--vocoder.gpu_memory_fraction"
    - "0.20"

external_backends:
  - id: "drama-3"
    type: "sglang-omni-tts"
    base_url: "http://127.0.0.1:8000"
