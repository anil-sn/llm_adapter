# LLM Orchestrator - Nemotron Model Configuration
# Overrides for nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-FP8
# Inherits from: config.yaml, config-adapter.yaml
# Driver 575.64.03 + vLLM 0.19.0 with FP8 KV cache

# ============================================================================
# MODEL IDENTITY
# ============================================================================
model:
  id: "nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-FP8"
  served_model_name: "mystery-ai"  # Abstracted - hides model identity
  tokenizer_mode: "auto"

# ============================================================================
# HARDWARE OVERRIDES
# ============================================================================
hardware:
  gpu_memory_utilization: 0.85     # Tested stable at 85%
  # attention_backend: auto          # Let vLLM choose (commented out for v0.22.0)

# ============================================================================
# INFERENCE OVERRIDES
# ============================================================================
inference:
  # Context settings (TurboQuant 2-bit enables 256K on 196GB VRAM)
  max_model_len: 262144            # 256K context (4× KV cache efficiency vs FP8)

  # KV cache dtype (must be explicit for vLLM 0.22.0)
  kv_cache_dtype: "auto"           # auto = FP16/BF16 (FP8 model weights)

  # Batch settings
  max_num_batched_tokens: 16384    # Conservative for stability

  # Reasoning settings
  reasoning_parser: "super_v3"     # Nemotron Super V3 parser
  reasoning_parser_plugin: "./super_v3_reasoning_parser.py"

  # Tool calling
  tool_call_parser: "qwen3_coder"  # XML format parser
