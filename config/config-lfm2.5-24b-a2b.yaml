# LiquidAI LFM2.5-24B-A2B: 24B total / 2.45B active MoE reasoning model.
# Four RTX 6000 Ada GPUs (TP=4).  The 131K native context avoids quality loss
# from RoPE scaling while leaving substantial KV-cache headroom per GPU.

model:
  id: "LiquidAI/LFM2.5-24B-A2B"
  served_model_name: "lfm2.5-24b-a2b"
  tokenizer_mode: "auto"
  trust_remote_code: false
  engine_preference: "v0"

replicas:
  count: 1
  base_port: 8000
  gpu_groups: ["0,1,2,3"]
  core_ranges: ["0-55,56-111"]

hardware:
  # TP must equal the four CUDA devices in gpu_groups.
  tensor_parallel_size: 4
  dtype: "bfloat16"
  gpu_memory_utilization: 0.90
  attention_backend: "TRITON_ATTN"
  # The host's GPUs are connected over PCIe rather than NVLink.
  disable_custom_all_reduce: true

inference:
  # Native model limit: do not apply RoPE scaling.
  max_model_len: 131072
  kv_cache_dtype: "auto"
  enable_prefix_caching: true
  enable_chunked_prefill: true
  max_num_batched_tokens: 32768
  max_num_seqs: 4

  # LFM2.5 is a reasoning-only checkpoint.  vLLM's native LFM parser handles
  # its Python-like <|tool_call_*|> tool-call representation.
  enable_thinking: true
  reasoning_parser: "qwen3"
  tool_call_parser: "lfm2"
  enable_auto_tool_choice: true

  # Liquid's documented defaults, made explicit so client-side defaults do
  # not silently override the model's intended low-temperature agent profile.
  override_generation_config:
    temperature: 0.1
    top_k: 50
    repetition_penalty: 1.05
  default_max_tokens: 4096
  max_output_tokens: 16384

vllm:
  env:
    # The installed launcher and the existing LFM2.5 config use V0 for stable
    # native LFM support on this machine.
    VLLM_USE_V1: "0"
    VLLM_ATTENTION_BACKEND: "TRITON_ATTN"
