# LLM Orchestrator - Google Gemma 4 31B NVFP4 Configuration
# Model: nvidia/Gemma-4-31B-IT-NVFP4
# Quantization: NVFP4 (weights) / BF16 (activations) + FP8 KV Cache
# Architecture: Dense Transformer (31B parameters, 60 layers)
# Context: 256K native context window
# Hardware: 4× RTX 6000 Ada (48GB each, PCIe topology)
# Inherits from: config.yaml, config-adapter.yaml

# ============================================================================
# MODEL IDENTITY
# ============================================================================
model:
  id: "nvidia/Gemma-4-31B-IT-NVFP4"
  served_model_name: "gemma4-31b"
  tokenizer_mode: "auto"
  trust_remote_code: true          # Required for native Gemma 4 custom operators
  precision_profile: "nvfp4"
  engine_preference: "v0"

# ============================================================================
# HARDWARE OVERRIDES
# ============================================================================
hardware:
  dtype: "auto"                    # Let vLLM select optimal precision for NVFP4 loading
  gpu_memory_utilization: 0.90     # Safely leaves VRAM headroom for multi-sequence cache blocks
  tensor_parallel_size: 4          # Distribute over all 4 RTX 6000 Ada GPUs
  attention_backend: "TRITON_ATTN"  # Required for FP8 KV cache and Marlin FP4 compatibility
  disable_custom_all_reduce: true  # CRITICAL: Disables custom CUDA kernel reductions, preventing PCIe bus saturation

# ============================================================================
# INFERENCE SETTINGS
# ============================================================================
inference:
  # Extended context window - 1M tokens (4× native 256K via YaRN)
  max_model_len: 1048576

  # YaRN RoPE Scaling for 1M context
  rope_scaling:
    type: "yarn"
    factor: 4.0                    # 4× scaling from 256K native
    original_max_position_embeddings: 262144

  # KV cache optimization
  kv_cache_dtype: "fp8"            # FP8 KV Cache to optimize context memory capacity

  # Prefill and execution optimization
  enable_chunked_prefill: true     # Processes long inputs in chunks to prevent VRAM spikes
  enable_prefix_caching: true      # Reuses KV cache for multi-turn conversations
  max_num_batched_tokens: 16384    # Optimized prefill batch size
  max_num_seqs: 4                  # Highly concurrent multi-turn agent streams

  # Tool calling and reasoning
  enable_auto_tool_choice: true
  tool_call_parser: "gemma4"       # Native Gemma 4 tool calling schema
  reasoning_parser: "gemma4"       # Native Gemma 4 reasoning/thinking parser
  enable_thinking: false           # Dynamic client-controlled reasoning (disabled by default)

  # Output settings
  default_max_tokens: 16384
  max_output_tokens: 65536

# ============================================================================
# VLLM ENVIRONMENT
# ============================================================================
vllm:
  env:
    VLLM_ATTENTION_BACKEND: "TRITON_ATTN"
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True" # Combats virtual VRAM memory fragmentation
    NCCL_P2P_DISABLE: "1"           # CRITICAL: Prevents driver deadlocks on non-NVLink PCIe systems
    NCCL_IB_DISABLE: "1"            # Disable InfiniBand explicitly
    NCCL_SHM_DISABLE: "0"           # Explicitly enable system shared memory
    CUDA_DEVICE_MAX_CONNECTIONS: "1" # Stabilize multi-GPU execution pipelines
    VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
    VLLM_USE_V1: "0"                 # Disable V1 for stable legacy V0 execution on SM89
