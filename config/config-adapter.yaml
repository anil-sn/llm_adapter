# LLM Orchestrator - Adapter Configuration
# Routing rules and adapter-specific settings

# ============================================================================
# ADAPTER ROUTING RULES
# ============================================================================
# Pattern-based routing: matches client requests to adapters
# Evaluation order: top to bottom (first match wins)

model_rules:
  # Gemma requests → GemmaAdapter (MUST come before claude!)
  - pattern: "gemma"
    adapter: "gemma"

  # Claude-style requests → ClaudeAdapter
  - pattern: "claude"
    adapter: "claude"

  # Qwen, Reasoner and Oracle requests → QwenAdapter (handles thinking and reasoning logs)
  - pattern: "qwen|reasoner|oracle"
    adapter: "qwen"

  # Nemotron/NVIDIA requests → NemotronAdapter
  - pattern: "nemotron|nvidia"
    adapter: "nemotron"

  # Mistral requests → MistralAdapter
  - pattern: "mistral"
    adapter: "mistral"

  # Laguna requests → LagunaAdapter
  - pattern: "laguna"
    adapter: "laguna"

  # Fallback → OpenAIAdapter
  - pattern: ".*"
    adapter: "openai"

# ============================================================================
# ADAPTER-SPECIFIC SETTINGS
# ============================================================================

# Claude Adapter Settings
claude_adapter:
  default_max_tokens: 16384  # Default output tokens (from model config)
  # This ensures Claude Code gets adequate tokens even when not specified

# Qwen Adapter Settings
qwen_adapter:
  # Sampling profiles for different use cases
  sampling_profiles:
    thinking_general:
      description: "General reasoning with thinking mode enabled"
      temperature: 1.0
      top_p: 0.95
      top_k: 20
      min_p: 0.0
      presence_penalty: 1.5
      repetition_penalty: 1.0

    thinking_coding:
      description: "Precise coding tasks with thinking mode"
      temperature: 0.6
      top_p: 0.95
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
      repetition_penalty: 1.0

    instruct_general:
      description: "General instruction following without thinking"
      temperature: 0.7
      top_p: 0.8
      top_k: 20
      min_p: 0.0
      presence_penalty: 1.5
      repetition_penalty: 1.0

    instruct_reasoning:
      description: "Complex reasoning without thinking tags"
      temperature: 1.0
      top_p: 1.0
      top_k: 40
      min_p: 0.0
      presence_penalty: 2.0
      repetition_penalty: 1.0

  # Default settings
  default_max_tokens: 32768
  max_output_tokens: 81920

# Gemma Adapter Settings
gemma_adapter:
  default_max_tokens: 16384  # Conservative for 512K context
  max_output_tokens: 65536   # Max output for 512K context (64K)

# Mistral Adapter Settings
mistral_adapter:
  default_max_tokens: 16384
  max_output_tokens: 65536
  # Autonomous behavior prompt - encourages the model to proceed without asking for permission
  autonomous_system_prompt: |
    You are an autonomous AI assistant. When given tasks:
    - Proceed with available tools and skills without asking for permission
    - If a skill is available (e.g., /review), use it immediately
    - Make decisions and take action rather than presenting options
    - Only ask for clarification when the task itself is ambiguous, not when the approach is clear
    - Default to action over discussion

# Nemotron Adapter Settings
nemotron_adapter: {}  # Empty for now - add Nemotron-specific settings if needed

# OpenAI Adapter Settings (fallback)
openai_adapter: {}  # Empty for now - add OpenAI-specific settings if needed
