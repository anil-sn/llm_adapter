# LLM Orchestrator - Qwen3.5-397B-A17B REAP 28% Pruned NVFP4 Configuration (256K Context)
# Model: rene98c/Qwen3.5-397B-A17B-REAP-28-NVFP4 (164GB weights, 397B sparse MoE)
# Quantization: NVFP4 (NVIDIA 4-bit weights) / BF16 (activations) + FP8 KV Cache
# Hardware: 4× RTX 6000 Ada (48GB each, PCIe topology, no NVLink)
# Compatibility: Mathematically squeezed (fits weights and massive 256K KV cache)
# Inherits from: config.yaml, config-adapter.yaml

# ============================================================================
# MODEL IDENTITY
# ============================================================================
model:
  chat_template: "config/qwen_fixed.jinja"
  id: "rene98c/Qwen3.5-397B-A17B-REAP-28-NVFP4"
  served_model_name: "qwen35-397b-reap"
  tokenizer_mode: "auto"
  trust_remote_code: true
  precision_profile: "nvfp4"
  engine_preference: "v0"

# ============================================================================
# HARDWARE OVERRIDES
# ============================================================================
hardware:
  dtype: "bfloat16"                # Execution datatype
  gpu_memory_utilization: 0.900    # Comfortable 90% allocation for safe headroom alongside background sessions (38.18GB weights + KV Cache)
  tensor_parallel_size: 4          # 4× RTX 6000 Ada (48GB each)
  attention_backend: "TRITON_ATTN"  # Use Triton Attention (TRITON_ATTN) as it fully supports FP8 KV Cache with low startup memory footprint
  disable_custom_all_reduce: true  # CRITICAL: Disables custom CUDA kernel reductions, preventing PCIe bus saturation
  max_parallel_loading_workers: 1  # CRITICAL: Load weights sequentially to prevent peak memory deserialization spikes and OOMs

# ============================================================================
# INFERENCE OVERRIDES
# ============================================================================
inference:
  # Context settings - Right-sized 128K context to save massive static activation VRAM (125K request)
  max_model_len: 131072

  # YaRN RoPE Scaling for 128K context (4x from 32K)
  rope_scaling:
    type: "yarn"
    factor: 4.0
    original_max_position_embeddings: 32768

  # KV cache optimization
  kv_cache_dtype: "fp8"            # FP8 KV cache for memory efficiency (critical for deep context)
  enable_prefix_caching: true      # REUSES KV Cache for identical prefixes (huge memory and prefill latency saver)

  # MoE Settings
  enable_expert_parallel: true     # Required for sparse MoE routing
  moe_backend: "marlin"            # Highly optimized 4-bit Marlin MoE kernel (unlocked via our custom FP4 padding patch!)

  # Prefill optimization
  enable_chunked_prefill: true
  max_num_batched_tokens: 4096     # Safe prefill chunk size
  max_num_seqs: 2                  # Allow up to 2 concurrent sequences

  # Tool calling and reasoning
  tool_call_parser: "qwen3_coder"  # XML format parser
  reasoning_parser: "super_v3"     # Reasoning extractor

  # Performance and Memory Optimization
  enforce_eager: true              # CRITICAL: Disables CUDA graphs to reclaim 1-2 GiB VRAM per GPU, resolving weight loading OOMs

# ============================================================================
# VLLM ENVIRONMENT
# ============================================================================
vllm:
  env:
    VLLM_ATTENTION_BACKEND: "TRITON_ATTN"
    VLLM_MLA_DISABLE: "1"                             # Bypasses Hopper/SM90 FlashMLA
    PYTORCH_CUDA_ALLOC_CONF: "backend:cudaMallocAsync" # Use CUDA driver allocator to remap physical pages and avoid fragmentation OOMs
    NCCL_P2P_DISABLE: "0"                             # ENABLE direct PCIe Peer-to-Peer communication (extremely fast on slcx-p7960!)
    NCCL_BUFFSIZE: "2097152"                          # Large 2MB communication buffers to accelerate PCIe sync
    NCCL_IB_DISABLE: "1"                                # Disable InfiniBand explicitly
    NCCL_SHM_DISABLE: "0"                               # Explicitly enable system shared memory
    CUDA_DEVICE_MAX_CONNECTIONS: "1"                    # Stabilize multi-GPU execution pipelines
    VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
    VLLM_USE_V1: "0"                                    # Disable V1 for stable execution
