# Ornith-1.5-122B NVFP4 target with the IncoAI DFlash2 speculative drafter.
# Target: https://huggingface.co/ornith-ai/Ornith-1.5-122B-NVFP4
# Drafter: https://huggingface.co/incoai/Ornith-1.5-122B-DFlash2
#
# Ornith's native context is 262K. YaRN factor 2 extends it to 524K; this
# extension is documented by the model authors. DFlash2's published recipe
# uses SGLang with TP=2 and the original target; this config uses vLLM, NVFP4,
# and TP=4, so validate the DFlash2/NVFP4 combination at startup and benchmark.

model:
  id: "ornith-ai/Ornith-1.5-122B-NVFP4"
  served_model_name: "ornith-1.5-122b-nvfp4-dflash2"
  tokenizer_mode: "auto"
  trust_remote_code: true
  precision_profile: "nvfp4"
  engine_preference: "v0"

replicas:
  count: 1
  base_port: 8000
  gpu_groups: ["0,1,2,3"]
  core_ranges: ["0-55,56-111"]

hardware:
  dtype: "auto"
  gpu_memory_utilization: 0.95
  tensor_parallel_size: 4
  attention_backend: "TRITON_ATTN"
  disable_custom_all_reduce: true

inference:
  # 524,288 tokens: 2x the 262,144 native window, using the author's YaRN recipe.
  max_model_len: 524288
  rope_scaling:
    rope_type: "yarn"
    factor: 2.0
    original_max_position_embeddings: 262144
  kv_cache_dtype: "fp8"
  enable_prefix_caching: true
  enable_chunked_prefill: true
  enable_expert_parallel: true
  moe_backend: "auto"
  max_num_batched_tokens: 16384
  max_num_seqs: 2

  enable_thinking: true
  reasoning_parser: "qwen3"
  tool_call_parser: "qwen3_xml"
  enable_auto_tool_choice: true

  default_max_tokens: 8192
  max_output_tokens: 32768

speculative_decoding:
  method: "dflash"
  draft_model: "incoai/Ornith-1.5-122B-DFlash2"
  draft_tensor_parallel_size: 4
  num_speculative_tokens: 16

vllm:
  env:
    VLLM_ATTENTION_BACKEND: "TRITON_ATTN"
    VLLM_USE_V1: "1"
    VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    NCCL_P2P_DISABLE: "1"
    NCCL_IB_DISABLE: "1"
    NCCL_SHM_DISABLE: "0"
    CUDA_DEVICE_MAX_CONNECTIONS: "1"
