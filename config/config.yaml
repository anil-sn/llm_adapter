# LLM Orchestrator - Base Configuration
# Common settings shared across all models
# Hardware: 4x NVIDIA RTX 6000 Ada (49GB each, 196GB total)

# ============================================================================
# CLUSTER SETTINGS
# ============================================================================
cluster:
  gateway_port: 8888
  routing_strategy: "prefix_hash"
  spillover:
    enabled: true
    queue_threshold: 4

# ============================================================================
# REPLICA CONFIGURATION
# ============================================================================
replicas:
  count: 1
  base_port: 8000
  gpu_groups: ["0,1,2,3"]      # Use all 4 GPUs
  core_ranges:
    - "0-55,56-111"            # CPU core affinity

# ============================================================================
# HARDWARE CONFIGURATION (Common across all models)
# ============================================================================
hardware:
  tensor_parallel_size: 4      # MUST match number of GPUs
  device: "cuda"
  dtype: "auto"

  # Attention backend (required for FP8 KV cache)
  attention_backend: "TRITON_ATTN"

  # PCIe topology settings (non-NVLink)
  disable_custom_all_reduce: true

  # Environment variables (shared)
  env_vars:
    HF_HUB_OFFLINE: "1"                    # Use cached models only
    VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"     # Allow large context windows
    TOKENIZERS_PARALLELISM: "true"
    NCCL_CROSS_NIC: "0"                    # PCIe topology
    PYTORCH_ALLOC_CONF: "expandable_segments:True,max_split_size_mb:512"
    VLLM_LOGGING_LEVEL: "CRITICAL"         # Suppress verbose logs
    VLLM_CONFIGURE_LOGGING: "0"
    CUDA_LAUNCH_BLOCKING: "0"              # Async kernel launches
    PYTORCH_CUDA_ALLOC_CONF: "backend:native"
    OMP_NUM_THREADS: "1"
    VLLM_WORKER_MULTIPROC_METHOD: "spawn"

# ============================================================================
# INFERENCE SETTINGS (Defaults - can be overridden per model)
# ============================================================================
inference:
  # KV Cache settings (common)
  kv_cache_dtype: "fp8"
  enable_prefix_caching: true
  enable_chunked_prefill: true

  # Batch & sequence settings (defaults)
  max_num_seqs: 2
  max_num_batched_tokens: 16384

  # Tool calling (common)
  enable_auto_tool_choice: true

  # Thinking/reasoning (default disabled)
  enable_thinking: false

# ============================================================================
# OBSERVABILITY
# ============================================================================
observability:
  log_level: "INFO"
  metrics: true
  metrics_port: 9090
