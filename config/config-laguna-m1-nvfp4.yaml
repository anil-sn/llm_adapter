# LLM Orchestrator - poolside/Laguna-M.1-NVFP4 Configuration (4-GPU / 128K CONTEXT)
# Model: poolside/Laguna-M.1-NVFP4 (7B MoE, NVFP4 quantization, compressed-tensors)
# Architecture: 70 layers, 256 experts (16 per token), 64 Q heads, 8 KV heads
# Size: ~3.9GB compressed (3923MB) | Framework: VLLM / SGLang
# Inherits from: config.yaml, config-adapter.yaml

# ============================================================================
# MODEL IDENTITY
# ============================================================================
model:
  id: "poolside/Laguna-M.1-NVFP4"
  served_model_name: "laguna-m1"
  trust_remote_code: true
  engine_preference: "v0"

# ============================================================================
# CLUSTER & REPLICA RUNNER ISOLATION (Strictly uses all 4 GPUs)
# ============================================================================
replicas:
  count: 1
  gpu_groups: ["0,1,2,3"]               # Distributed across all 4 GPUs
  core_ranges: ["0-111"]

# ============================================================================
# HARDWARE OVERRIDES
# ============================================================================
hardware:
  dtype: "auto"
  gpu_memory_utilization: 0.85          # Official recipe default: 0.85 allocation for safe headroom
  tensor_parallel_size: 4               # TP=4
  attention_backend: "FLASHINFER"       # High-performance GQA support (64 Q / 8 KV heads)

# ============================================================================
# INFERENCE SETTINGS
# ============================================================================
inference:
  max_model_len: 32768                  # ~32K context (within KV cache budget: 1.41 GiB available)

  # KV cache fits within available memory — no RoPE override needed
  # For longer contexts, use sliding-window or chunked prefill optimizations

  # KV Cache: auto (BF16) for numerical stability on Ada Lovelace
  kv_cache_dtype: "auto"

  enable_prefix_caching: true
  enable_chunked_prefill: true          # Vital to prevent OOM during massive prompt processing

  # Batch settings
  max_num_batched_tokens: 16384
  max_num_seqs: 32                      # Official recipe default: DFlash crashes vLLM at the default of 256. Must be 32.

  # Reasoning control: default-on or client-controlled
  enable_thinking: true
  reasoning_parser: "poolside_v1"
  tool_call_parser: "poolside_v1"       # Keeps tool calling fully enabled!

  # Official recipe generation config override: prevents FP8/FP4 quantization output degradation
  override_generation_config:
    temperature: 0.7
    top_p: 0.95

  # Output settings
  default_max_tokens: 16384
  max_output_tokens: 65536

# ============================================================================
# SPECULATIVE DECODING (N-gram speculative lookup)
# ============================================================================
speculative_decoding:
  method: "ngram"
  num_speculative_tokens: 5

# ============================================================================
# VLLM ENVIRONMENT
# ============================================================================
vllm:
  env:
    VLLM_ATTENTION_BACKEND: "FLASHINFER" # Force FlashInfer for FP8 KV compatibility on Ada Lovelace
    VLLM_USE_V1: "0"                     # Disable V1 for hybrid attention compatibility
    VLLM_BLOCKSCALE_FP8_GEMM_FLASHINFER: "0" # CRITICAL: Bypasses Ada Lovelace (sm_89) FlashInfer blockscale FP8 GEMM numerical instability
