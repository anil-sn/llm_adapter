# Qwen3.8-Flash-Next NVFP4 — 4× RTX 6000 Ada, 512K YaRN experiment
#
# Separate from the native-262K profile so a verified production configuration
# remains available.  YaRN factor 2 extends the native 262,144-token window.

model:
  id: "nvidia/Qwen3.8-Flash-Next-NVFP4"
  served_model_name: "flash-next"
  tokenizer_mode: "auto"
  trust_remote_code: true
  engine_preference: "v0"
  chat_template: "config/qwen_fixed.jinja"

replicas:
  count: 1
  gpu_groups: ["0,1,2,3"]
  core_ranges: ["0-111"]

hardware:
  dtype: "auto"
  quantization: "modelopt"
  tensor_parallel_size: 4
  gpu_memory_utilization: 0.90
  attention_backend: "FLASHINFER"
  max_parallel_loading_workers: 1

inference:
  max_model_len: 524288
  # YaRN must be nested under text_config.rope_parameters — this architecture
  # (qwen4_exp) stores RoPE there; a top-level rope_scaling hf-override is ignored,
  # which silently ran 512K positions unscaled (long-context degradation).
  hf_overrides:
    text_config:
      rope_parameters:
        mrope_interleaved: true
        mrope_section: [11, 11, 10]
        rope_type: "yarn"
        rope_theta: 10000000
        partial_rotary_factor: 0.25
        factor: 2.0
        original_max_position_embeddings: 262144
  kv_cache_dtype: "auto"
  enable_prefix_caching: true
  enable_chunked_prefill: true
  max_num_batched_tokens: 16384
  # Long contexts need stricter KV-cache admission than the 262K service.
  max_num_seqs: 4

  enable_expert_parallel: true
  moe_backend: "auto"
  speculative_decoding:
    method: "mtp"
    # MTP3 tested faster on this 4x RTX 6000 Ada host (vLLM 0.32).
    num_speculative_tokens: 3

  enable_thinking: true
  reasoning_parser: "qwen3"
  tool_call_parser: "qwen3_coder"

  # Model-card validated sampling: Qwen3 thinking models degrade at low
  # temperature (repetition loops, truncated reasoning).
  override_generation_config:
    temperature: 1.0
    top_p: 0.95

  # Thinking tokens count against the cap; 4096 truncated reasoning chains.
  default_max_tokens: 16384
  max_output_tokens: 16384
  default_chat_template_kwargs:
    reasoning_effort: "medium"

vllm:
  env:
    VLLM_USE_V1: "0"
    # Required for max_model_len > derived 262K; was inherited from shell env only.
    VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
    FLASHINFER_DISABLE_VERSION_CHECK: "1"
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
