# LLM Orchestrator - Qwen3-Coder-Next FP8 4-GPU Configuration (1M CONTEXT)
# Model: Qwen/Qwen3-Coder-Next-FP8 (80B MoE, 3B Active, mid-2026 flagship)
# Quantization: FP8 (Native high-performance FP8 with SwiGLU clamp on Ada)
# Hardware: 4× RTX 6000 Ada (GPUs 0-3)
# Topology: PCIe topology, no NVLink
# 1M token context via YaRN 4× RoPE scaling from 256K native
# Inherits from: config.yaml, config-adapter.yaml

# ============================================================================
# MODEL IDENTITY
# ============================================================================
model:
  chat_template: "config/qwen_fixed.jinja"
  id: "Qwen/Qwen3-Coder-Next-FP8"
  served_model_name: "qwen3-coder-fp8"
  tokenizer_mode: "auto"
  # chat_template: auto (uses model's built-in template from tokenizer_config.json)

# ============================================================================
# HARDWARE OVERRIDES
# ============================================================================
hardware:
  gpu_memory_utilization: 0.90          # Balanced utilization with headroom on 4 GPUs
  tensor_parallel_size: 4               # TP=4 (split across 4 GPUs)

# ============================================================================
# INFERENCE SETTINGS
# ============================================================================
inference:
  # Extended context window - 1M tokens with YaRN RoPE scaling
  max_model_len: 1048576                # 1M tokens (~4x native 256K context)

  # YaRN RoPE Scaling for 1M context from 256K native
  rope_scaling:
    rope_type: "yarn"                   # YaRN scaling method (vLLM format)
    factor: 4.0                         # 4× scaling from 256K native
    original_max_position_embeddings: 262144

  # Memory-efficient features (CRITICAL for 1M)
  enable_prefix_caching: true           # Reuses KV cache for repeated prefixes
  enable_chunked_prefill: true          # Processes long prompts in chunks

  # KV cache optimization
  kv_cache_dtype: "fp8"                 # FP8 KV cache for memory efficiency (critical for 1M)

  # Batch settings - constrained for 1M context
  max_num_batched_tokens: 32768         # Aggressive prefill chunking
  max_num_seqs: 2                       # 2 concurrent 1M-context streams

  # Tool calling and reasoning
  enable_thinking: false                # Qwen3-Coder-Next operates in high-speed, non-thinking mode
  enable_auto_tool_choice: true         # Enable tool calling
  tool_call_parser: "qwen3_xml"         # Use XML parser (native format Qwen3 was trained on)

  # Speculative decoding (2-3x faster generation via n-gram prediction)
  speculative_decoding:
    method: "ngram"
    num_speculative_tokens: 5
    ngram_prompt_lookup_max: 4
    ngram_prompt_lookup_min: 1

# ============================================================================
# VLLM ENVIRONMENT
# ============================================================================
vllm:
  env:
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True" # Combat PyTorch memory fragmentation
    NCCL_P2P_DISABLE: "1"                             # CRITICAL: Disable NCCL P2P to prevent deadlocks on PCIe-only systems
    VLLM_FP8_ACTIVATION: "1"                          # Force native FP8 execution for maximum throughput
