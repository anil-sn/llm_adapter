# LLM Orchestrator - Qwen3.5-122B-A10B-GPTQ-Int4 Configuration
# EXTREME CONTEXT: 1M tokens with TurboQuant 2-bit KV cache
# Inherits from: config.yaml, config-adapter.yaml
# Driver 575.64.03 + vLLM 0.20+ with TurboQuant 2-bit KV cache

# ============================================================================
# MODEL IDENTITY
# ============================================================================
model:
  id: "Qwen/Qwen3.5-122B-A10B-GPTQ-Int4"
  served_model_name: "qwen-3.5-122b-1m"
  tokenizer_mode: "auto"
  trust_remote_code: true          # Required for Qwen

# ============================================================================
# QUANTIZATION - GPTQ Int4 (Pre-quantized checkpoint)
# ============================================================================
quantization:
  method: "gptq"                   # GPTQ Int4 quantization
  # Pre-quantized checkpoint, no on-the-fly quantization needed

# ============================================================================
# HARDWARE OVERRIDES
# ============================================================================
hardware:
  dtype: "float16"                 # REQUIRED for GPTQ (only supports FP16, not BF16)
  gpu_memory_utilization: 0.90     # Higher utilization for 1M context (monitor closely)
  attention_backend: "TRITON_ATTN" # Required for fp8 kv_cache (FLASH_ATTN doesn't support fp8)
  # GPTQ saves ~75% weight memory, TurboQuant saves 4× KV cache memory

# ============================================================================
# INFERENCE OVERRIDES - 1M CONTEXT
# ============================================================================
inference:
  # PHASE 5: 1M Extended Context (YaRN 4.0x scaling)
  max_model_len: 1048576           # 1M tokens (4× native with YaRN)

  # YaRN RoPE Scaling for 1M context
  rope_scaling:
    type: "yarn"
    factor: 4.0                    # 4× scaling from 262K native
    original_max_position_embeddings: 262144

  # Memory-efficient features (CRITICAL for 1M)
  enable_prefix_caching: true      # Reuses KV cache for repeated prefixes
  enable_chunked_prefill: true     # Processes long prompts in chunks

  # Batch settings - Single sequence for 1M context
  max_num_batched_tokens: 16384    # Conservative for memory
  max_num_seqs: 1                  # Only 1 concurrent request for 1M context

  # KV cache optimization - TurboQuant 2-bit (CRITICAL)
  kv_cache_dtype: "fp8_e5m2"       # Auto-compressed to 2-bit by TurboQuant (4× efficiency)

  # Reasoning settings
  reasoning_parser: "qwen3"        # Qwen3 built-in parser

  # Tool calling
  tool_call_parser: "qwen3_coder"  # Qwen's tool calling parser

  # Output settings
  default_max_tokens: 32768        # Default output length
  max_output_tokens: 131072        # Max output for 1M context (128K)

# ============================================================================
# MEMORY BUDGET ESTIMATE (1M Context)
# ============================================================================
#
# Hardware: 4× RTX 6000 Ada (49GB each) = 196GB total
#
# Model Weights (GPTQ Int4):
#   - Qwen3.5-122B quantized: ~50GB across 4 GPUs (~12.5GB per GPU)
#
# KV Cache (TurboQuant 2-bit for 1M tokens):
#   - Native FP16: ~200GB (impossible!)
#   - FP8: ~100GB (tight fit)
#   - TurboQuant 2-bit: ~50GB (FEASIBLE!)
#
# Total Memory Usage:
#   - Model: 50GB
#   - KV cache (1M tokens, 2-bit): ~50GB
#   - Activations & overhead: ~20-30GB
#   - Total: ~120-130GB
#   - Headroom: ~66-76GB (33-38% free)
#
# CONCLUSION: 1M context is FEASIBLE with TurboQuant 2-bit!
#
# ============================================================================
# PROGRESSIVE TESTING PLAN
# ============================================================================
#
# PHASE 1: 262K Native ✅ COMPLETED
# PHASE 2: 512K (YaRN 2.0×) ✅ COMPLETED
# PHASE 3: 640K (YaRN 2.5×) ✅ COMPLETED
# PHASE 4: 768K (YaRN 3.0×) 🎯 RECOMMENDED SAFE START
# PHASE 5: 1M (YaRN 4.0×) 🚀 EXPERIMENTAL (this config)
#
# Start with 768K, then scale to 1M if successful.
#
# ============================================================================
# TESTING RECOMMENDATIONS
# ============================================================================
#
# 1. Start with shorter context first:
#    - Test with 100K tokens
#    - Monitor GPU memory usage
#    - Gradually increase to 1M
#
# 2. Monitor memory during startup:
#    watch -n 1 nvidia-smi
#
# 3. If OOM errors occur:
#    - Reduce gpu_memory_utilization to 0.85
#    - Try 768K instead of 1M (YaRN 3.0×)
#    - Ensure max_num_seqs = 1
#
# 4. Quality considerations:
#    - YaRN 4× may degrade quality 10-15%
#    - Test with real workloads
#    - Compare outputs with shorter context
#
# ============================================================================
