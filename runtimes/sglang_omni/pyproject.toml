[project]
name = "llm-adapter-sglang-omni-runtime"
version = "0.1.0"
description = "Isolated SGLang-Omni runtime used by llm_adapter"
requires-python = ">=3.11,<3.13"
dependencies = [
    "sglang-omni[fishaudio]==0.1.9",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]
prerelease = "allow"
override-dependencies = ["protobuf>=6.31.1,<7.0.0"]
